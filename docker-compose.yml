services:
  postgres: 
    image: postgres:16
    container_name: transactions_postgres
    environment: 
      POSTGRES_DB: tranaction_db
      POSTGERS_USER: etl_user
      POSTGRES_PASSWORD: etl_psw
    ports: 
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes: 
  pg_data: