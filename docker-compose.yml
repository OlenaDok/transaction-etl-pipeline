services:
  postgres: 
    image: postgres:16
    container_name: transactions_postgres
    environment: 
      POSTGRES_DB: ${DOCKER_DB_NAME}
      POSTGERS_USER: ${DOCKER_DB_USER} 
      POSTGRES_PASSWORD: ${DOCKER_DB_PASSWORD}
    ports: 
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes: 
  pg_data: